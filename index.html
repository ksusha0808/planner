<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мой планер</title>
<meta name="theme-color" content="#4b3bd1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Планер">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#121118);--ink:light-dark(#1d1b2a,#f1eff7);--mut:light-dark(#6b6880,#a6a3b8);
--line:light-dark(#e7e5ef,#2b2938);--card:light-dark(#f6f5fa,#1b1a24);--band:light-dark(#4b3bd1,#2a2066);
--acc:#ff5b3a;--acc-soft:light-dark(#ffe9e3,#3a1f1a);--ok:light-dark(#14935f,#3fd194);
--vio:light-dark(#4b3bd1,#a394ff);--vio-soft:light-dark(#ecebfd,#26223f);
--c1:light-dark(#2a78d6,#3987e5);--c2:light-dark(#eb6834,#d95926);--c3:light-dark(#1baf7a,#199e70);--c4:light-dark(#eda100,#c98500);--c5:light-dark(#e87ba4,#d55181);--c6:light-dark(#008300,#0ca30c);--c7:light-dark(#6250d6,#9085e9);--c8:light-dark(#e34948,#e66767);--c0:light-dark(#8a8893,#77757f)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
h1,h2{font-family:Unbounded,Manrope,system-ui,sans-serif;font-weight:500;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,4.5vw,40px)}h2{font-size:18px;margin-bottom:14px}
.cap::first-letter{text-transform:uppercase}
.top{background:var(--band);color:#fff;padding:calc(16px + env(safe-area-inset-top)) max(4vw,16px) 0}
.top .in,.wrap{max-width:1160px;margin:0 auto}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand small{opacity:.85;font-size:13px}
nav{display:flex;gap:4px;margin-top:14px}
nav button{background:none;border:0;color:#fff;opacity:.75;padding:12px 16px;border-radius:12px 12px 0 0;font-weight:700;cursor:pointer;min-height:44px}
nav button.on{opacity:1;background:var(--bg);color:var(--ink)}
nav svg{display:none}
.wrap{padding:24px max(4vw,16px) 40px}
.hero{margin-bottom:20px}.hero p{margin:6px 0 0;color:var(--mut)}
.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
.card{background:var(--card);border-radius:18px;padding:20px}
.col>.card+.card{margin-top:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;font-size:16px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2.5px solid var(--vio);outline-offset:2px}
.grow{flex:1 1 200px}.full{width:100%}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:10px 18px;min-height:44px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--vio-soft);color:var(--vio)}
.btn.plain{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 14px;min-height:38px;cursor:pointer;font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
label.ck{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mut);cursor:pointer;min-height:44px}
label.ck input[type=checkbox]{min-height:0;width:20px;height:20px;accent-color:var(--acc);flex:none}
label.ck input[type=date],label.ck input[type=time],label.ck select{flex:none;color:var(--ink)}
.sec{font-size:13px;font-weight:800;color:var(--mut);margin:18px 0 4px;display:flex;gap:8px;align-items:center}
.sec.bad{color:var(--acc)}
ul.tasks{list-style:none;margin:0;padding:0}
.task{display:flex;gap:6px;align-items:flex-start;padding:4px 0;border-bottom:1px solid var(--line)}
.chk{flex:none;width:26px;height:26px;margin:9px;border-radius:8px;border:2px solid var(--mut);background:none;cursor:pointer;position:relative}
.chk::after{content:"";position:absolute;left:7px;top:2px;width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg);opacity:0}
.done .chk{background:var(--ok);border-color:var(--ok)}.done .chk::after{opacity:1}
.done .tt{text-decoration:line-through;color:var(--mut)}
.tbody{flex:1;cursor:pointer;padding:8px 0;min-height:44px}
.tt{font-weight:600;overflow-wrap:anywhere}
.tm{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;font-size:13px;color:var(--mut)}
.tag{background:var(--vio-soft);color:var(--vio);border-radius:6px;padding:1px 8px;font-weight:700;white-space:nowrap}
.tag.late{background:var(--acc-soft);color:var(--acc)}.tag.hot{background:var(--acc);color:#fff}
.x{flex:none;background:none;border:0;color:var(--mut);font-size:22px;width:44px;height:44px;cursor:pointer;border-radius:10px}
.x:hover{background:var(--line)}
.empty{color:var(--mut);font-size:15px;padding:10px 0}
.tedit{flex:1;display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:38px;font-weight:700;cursor:pointer;color:var(--mut);padding:0 10px;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg.mini{flex:0 0 auto}.seg.mini button{flex:0 0 auto;min-height:36px;font-size:14px;padding:0 12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:Unbounded,Manrope,sans-serif;font-weight:500;font-size:clamp(17px,2.4vw,22px);white-space:nowrap}
.stat span{font-size:13px;color:var(--mut)}
.pos{color:var(--ok)}.neg{color:var(--acc)}
.goal{background:var(--bg);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.goal .gh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.goal .gs{font-size:14px;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.goal .gs b{color:var(--ink);white-space:nowrap}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .5s}
.bar.v i{background:var(--vio)}.bar.c i{background:var(--acc)}
.gform{display:grid;grid-template-columns:minmax(0,1fr) 8.5em 6.5em;gap:8px}
.gform .btn,.gform .row{grid-column:1/-1}
.brow{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;margin:8px 0}
.brow .bar{margin:0;background:var(--bg)}.brow b{white-space:nowrap}
.ops{list-style:none;padding:0;margin:0}
.op{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.op .d{width:3.6em;font-size:13px;color:var(--mut);flex:none}
.op .l{flex:1}.op .l small{display:block;color:var(--mut);font-size:13px}
.op .a{font-weight:800;white-space:nowrap}
.mhead{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.mhead h2{margin:0;min-width:8em;text-align:center}
.arrow{width:44px;height:44px;border-radius:12px;border:0;background:var(--vio-soft);color:var(--vio);cursor:pointer;font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:12px;font-weight:800;color:var(--mut);text-align:center;padding:4px 0}
.day{background:var(--bg);border:2px solid transparent;border-radius:12px;min-height:92px;padding:6px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.day.out{opacity:.4}.day.today .dn{background:var(--acc);color:#fff}
.day.sel{border-color:var(--vio)}
.dn{font-weight:800;font-size:14px;width:26px;height:26px;border-radius:99px;display:grid;place-items:center}
.ct{font-size:12px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--vio-soft);color:var(--vio);border-radius:5px;padding:1px 5px}
.ct.dn2{text-decoration:line-through;opacity:.6}
.dots{display:none;gap:3px}.dots i{width:6px;height:6px;border-radius:99px;background:var(--vio)}
.note{font-size:13px;color:var(--mut);margin-top:10px}
.note ol{padding-left:1.2em;margin:6px 0}
.warn{color:var(--acc);font-size:14px;font-weight:700;margin-top:8px}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:99px;background:#fff;opacity:.5}.sync.on i{background:#6ff0b0;opacity:1}.sync.err i{background:var(--acc);opacity:1}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(200%);background:var(--ink);color:var(--bg);padding:10px 12px 10px 18px;border-radius:14px;display:flex;gap:12px;align-items:center;transition:transform .25s,opacity .25s,visibility .25s;z-index:20;visibility:hidden;opacity:0;max-width:92vw}
#toast.show{transform:translateX(-50%);visibility:visible;opacity:1}
#toast button{background:none;border:0;color:var(--acc);font-weight:800;min-height:40px;cursor:pointer}
code{overflow-wrap:anywhere;font-size:13px}
.subnav{max-width:380px;margin-bottom:18px;background:var(--card)}
.big{font-family:Unbounded,Manrope,sans-serif;font-weight:500;font-size:clamp(30px,6vw,48px);line-height:1;white-space:nowrap}
.delta{font-weight:700;font-size:14px}.delta.up{color:var(--acc)}.delta.down{color:var(--ok)}
.headline{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:flex-end;margin-bottom:6px}
.donutwrap{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:28px;align-items:center}
.donut{position:relative;width:min(100%,300px);aspect-ratio:1;margin:0 auto}
.donut svg{width:100%;height:100%;display:block;overflow:visible}
.donut .seg{cursor:pointer;transition:stroke-width .2s,opacity .2s}.donut .seg.dim{opacity:.3}.donut .seg.on{stroke-width:36}
.dc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;padding:24%}
.dc b{font-family:Unbounded,Manrope,sans-serif;font-size:clamp(17px,3.6vw,23px);font-weight:500;white-space:nowrap}
.dc span{font-size:13px;color:var(--mut);overflow-wrap:anywhere}
.leg{list-style:none;padding:0;margin:0}
.lg{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto;gap:10px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 6px;text-align:left;cursor:pointer;min-height:48px;border-radius:10px}
.lg:hover{background:var(--bg)}.lg.on{background:var(--bg);box-shadow:inset 0 0 0 2px var(--line)}.lg.dim{opacity:.5}
.sw{width:14px;height:14px;border-radius:4px}
.lg small{display:block;color:var(--mut);font-size:12px}
.lg .p{font-weight:800;text-align:right;min-width:3em}.lg .v{white-space:nowrap;text-align:right}
.vchart{display:flex;align-items:flex-end;gap:6px;height:210px;padding-top:26px}
.vcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:6px;font-size:12px;color:var(--mut);cursor:default}
.vb{width:100%;max-width:46px;border-radius:4px 4px 0 0;opacity:.4;position:relative;min-height:2px}
.vb.cur{opacity:1}
.vcol:hover .vb{opacity:.85}.vcol:hover .vb::after,.vb.cur::after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:4px;white-space:nowrap;font-size:12px;font-weight:800;color:var(--ink);background:var(--bg);padding:1px 6px;border-radius:6px;z-index:2}
.vchart:has(.vcol:hover) .vb.cur:not(:hover)::after{display:none}
.vcol:hover .vb.cur::after{display:block}
.insight{background:var(--bg);border-radius:12px;padding:10px 14px;font-size:15px;margin-top:14px}
@media(max-width:700px){.donutwrap{grid-template-columns:minmax(0,1fr)}.vchart{gap:3px}}
/* week calendar */
.ldot{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:5px;vertical-align:baseline;flex:none}
.evcard{margin-bottom:16px;box-shadow:0 0 0 2px var(--vio) inset}
.wk{--h:48px;background:var(--bg);border-radius:14px;border:1px solid var(--line);overflow:clip}
.wkhead,.wkall,.wkbody{display:grid;grid-template-columns:52px repeat(var(--n),minmax(0,1fr))}
.wkhead{border-bottom:1px solid var(--line);background:var(--bg)}
.wkd{background:none;border:0;padding:8px 2px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:12px;text-transform:uppercase;font-weight:700;min-height:44px}
.wkd b{font-size:22px;font-weight:500;color:var(--ink);width:42px;height:42px;border-radius:99px;display:grid;place-items:center}
.wkd.today{color:#1a73e8}.wkd.today b{background:#1a73e8;color:#fff}
.wkd.sel:not(.today) b{background:var(--vio-soft)}
.wkall{border-bottom:1px solid var(--line)}.wkall>div{padding:3px 2px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line);min-width:0}
.wkall .lbl{border:0;color:var(--mut);font-size:11px;padding:6px 4px;justify-content:center}
.chipev{border-radius:5px;padding:2px 6px;color:#fff;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:0;text-align:left;font-size:12px;min-height:22px}
.wkbody{position:relative;height:var(--total);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--h))}
.wktimes{position:relative;background:var(--bg)}.wktimes span{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--mut);white-space:nowrap}
.wkcol{position:relative;border-left:1px solid var(--line);cursor:copy}
.ev{position:absolute;border-radius:6px;padding:3px 6px;color:#fff;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;box-shadow:inset 4px 0 0 rgba(0,0,0,.2);outline:1px solid var(--bg);z-index:1;text-align:left;border:0;display:block}
.ev b{font-weight:700;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ev span{display:block;opacity:.95;white-space:nowrap;font-size:11.5px}
.ev.sm b{-webkit-line-clamp:1;display:inline}.ev.sm span{display:inline;margin-left:5px}
.ev.past{filter:saturate(.55) brightness(1.15);opacity:.8}
.ev.done{opacity:.45}.ev.done b{text-decoration:line-through}
.ev:hover{z-index:4;box-shadow:inset 4px 0 0 rgba(0,0,0,.2),0 4px 14px rgba(0,0,0,.25)}
.nowl{position:absolute;left:0;right:0;height:2px;background:#ea4335;z-index:3;pointer-events:none}.nowl::before{content:"";position:absolute;left:-6px;top:-5px;width:12px;height:12px;border-radius:99px;background:#ea4335}
.wkhint{font-size:13px;color:var(--mut);margin:8px 2px 0}
@media(max-width:700px){.wkhead,.wkall,.wkbody{grid-template-columns:40px repeat(var(--n),minmax(0,1fr))}.wk{--h:44px}.wkd b{font-size:19px;width:36px;height:36px}}
/* desktop widget */
body.wmode{background:var(--bg)}body.wmode .top,body.wmode #nav{display:none}body.wmode .wrap{padding:0;max-width:none}
.wg{display:flex;flex-direction:column;height:100vh;min-height:420px;background:var(--bg);overflow:hidden}
.wghead{background:linear-gradient(160deg,#5a49e0,var(--band) 60%);color:#fff;padding:16px 18px 14px;position:relative}
.wgclock{font-family:Unbounded,Manrope,sans-serif;font-weight:500;font-size:46px;line-height:1;letter-spacing:-1px}
.wgdate{opacity:.85;font-size:14px;margin-top:4px}.wgdate::first-letter{text-transform:uppercase}
.wgnow{margin-top:12px;background:rgba(255,255,255,.14);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.35}
.wgnow b{font-weight:800}.wgnow small{display:block;opacity:.8;font-size:12px}
.wgnow i{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:6px;vertical-align:1px}
.wgtabs{display:flex;gap:6px;padding:10px 14px 6px;align-items:center}
.wgtabs .chip{min-height:32px;padding:4px 12px}.wgtabs .sp{flex:1}
.wgtabs a,.wgtabs button.link{font-size:13px;color:var(--vio);font-weight:700;text-decoration:none;background:none;border:0;cursor:pointer;padding:6px}
.wgscroll{flex:1;overflow-y:auto;padding:0 14px 10px;scrollbar-width:thin}
.wgtl{position:relative;margin-left:42px;background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--wh))}
.wgtl .tm{position:absolute;left:-42px;width:36px;text-align:right;transform:translateY(-50%);font-size:11px;color:var(--mut)}
.wgtl .ev{left:2px;right:2px;width:auto}
.wgtl .ev b{-webkit-line-clamp:2}
.wgall{display:flex;flex-direction:column;gap:2px;margin:4px 0 8px 42px}
.wgfoot{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wgfoot .btn{min-height:36px;padding:6px 12px;font-size:14px}
.wgempty{color:var(--mut);font-size:14px;padding:16px 0;text-align:center}
.wgtask{display:flex;align-items:center;gap:8px;font-size:14px;padding:4px 0}
.wgtask .chk{width:22px;height:22px;margin:0;border-radius:7px}.wgtask .chk::after{left:6px;top:1px;width:6px;height:11px}
.wgtask.done span{text-decoration:line-through;color:var(--mut)}
.wgsec{font-size:12px;font-weight:800;color:var(--mut);margin:10px 0 2px}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){
 .top{padding-bottom:16px}
 nav{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--bg);border-top:1px solid var(--line);z-index:10;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
 nav button{flex:1;color:var(--mut);opacity:1;border-radius:12px;padding:6px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
 nav button.on{background:var(--vio-soft);color:var(--vio)}
 nav svg{display:block;width:22px;height:22px}
 .wrap{padding-bottom:120px}
 .card{padding:16px;border-radius:16px}
 .seg button{padding:0 4px;font-size:14px}.seg.mini button{padding:0 10px}
 .day{min-height:52px;padding:4px;align-items:center}.ct,.more{display:none}.dots{display:flex}
 .gform{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.gform .gn{grid-column:1/-1}
 #toast{bottom:calc(90px + env(safe-area-inset-bottom))}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in">
 <div class="brand"><h1>Мой планер</h1><small class="sync" id="syncdot"><i></i><span id="synctxt">На этом устройстве</span></small></div>
 <nav id="nav">
  <button data-act="tab" data-t="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Сегодня</button>
  <button data-act="tab" data-t="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6l2 2 3-3M4 13l2 2 3-3M12 7h8M12 14h8M5 20h15"/></svg>Задачи</button>
  <button data-act="tab" data-t="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Календарь</button>
  <button data-act="tab" data-t="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="3"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 9.5v6M18 9.5v6"/></svg>Деньги</button>
  <button data-act="tab" data-t="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Настройки</button>
 </nav>
</div></header>
<main class="wrap" id="main"></main>
<div id="toast" role="status"><span id="tmsg"></span><button id="tundo" hidden>Вернуть</button></div>
<input type="file" id="importfile" accept="application/json,.json" hidden>
<script>
{
const LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
const KEY='planner-v2';
const DEF_META={lists:['Учёба','Репетиторство','Личное'],sources:['Репетиторство','Подработка','Стипендия','Другое'],cats:['Еда','Транспорт','Учёба','Развлечения','Одежда','Подписки','Другое']};

/* ---------- dates & format ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const monday=s=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
let now,TODAY,TOM,WEEK,THISW,NEXTW;
function setToday(){now=new Date();TODAY=iso(now);TOM=addDays(TODAY,1);WEEK=addDays(TODAY,7);THISW=monday(TODAY);NEXTW=addDays(THISW,7)}
setToday();
const short=s=>new Date(s+'T12:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
const fmtD=s=>{if(!s)return'';if(s===TODAY)return'Сегодня';if(s===TOM)return'Завтра';if(s===addDays(TODAY,-1))return'Вчера';return short(s)};
const range=w=>{const e=addDays(w,6);const a=new Date(w+'T12:00'),b=new Date(e+'T12:00');return a.getMonth()===b.getMonth()?a.getDate()+'–'+short(e):short(w)+' – '+short(e)};
const wname=w=>w===THISW?'Эта неделя':w===NEXTW?'Следующая неделя':w<THISW?'Неделя '+range(w):'Неделя '+range(w);
const monthName=(y,m)=>new Date(y,m,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'}).replace(/\s*г\.?$/,'');
const ym=(y,m)=>y+'-'+pad(m+1);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rub=n=>(n<0?'−':'')+new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.abs(Math.round(n)))+' ₽';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const opts=(arr,sel)=>arr.map(v=>`<option${v===sel?' selected':''}>${esc(v)}</option>`).join('');
const sum=a=>a.reduce((s,t)=>s+(+t.amount||0),0);
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c};

/* ---------- local store ---------- */
let DB={items:{},dirty:{},cfg:{},lastSync:0};
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.items)DB=Object.assign(DB,d)}catch(e){}
if(!DB.items.meta){DB.items.meta={id:'meta',kind:'meta',...DEF_META,upd:1};
 DB.items['g-car']={id:'g-car',kind:'goal',name:'Машина',target:0,pct:20,created:1,upd:1};
 DB.items['g-inv']={id:'g-inv',kind:'goal',name:'Инвестиции',target:0,pct:20,created:2,upd:1}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('Не получилось сохранить на устройстве')}}
const list=k=>Object.values(DB.items).filter(x=>x.kind===k&&!x.del);
const META=()=>Object.assign({},DEF_META,DB.items.meta||{});
const goals=()=>list('goal').sort((a,b)=>(a.created||0)-(b.created||0));
const goalById=id=>{const g=DB.items[id];return g&&g.kind==='goal'&&!g.del?g:null};
function save(obj){obj.upd=Date.now();DB.items[obj.id]=obj;DB.dirty[obj.id]=1;persist();render();kick()}
function remove(id){const o=DB.items[id];if(o)save({...o,del:true})}

/* ---------- UI state ---------- */
let ui={};try{ui=JSON.parse(localStorage.getItem('planner-ui')||'{}')}catch(e){}
const UI={tab:ui.tab||'today',filter:'Все',calY:now.getFullYear(),calM:now.getMonth(),sel:TODAY,mY:now.getFullYear(),mM:now.getMonth(),editing:null,editGoal:null,txType:'out',showDone:false,wday:'today',cview:'week',ev:null,msub:'ledger',speriod:'month',scat:null,mode:{},feed:''};
const drafts={};

/* ---------- toast ---------- */
let tT,undoFn=null;
function toast(msg,undo){const t=document.getElementById('toast');document.getElementById('tmsg').textContent=msg;const u=document.getElementById('tundo');undoFn=undo||null;u.hidden=!undo;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),undo?6000:3000)}
document.getElementById('tundo').addEventListener('click',()=>{if(undoFn)undoFn();undoFn=null;document.getElementById('toast').classList.remove('show')});

/* ---------- tasks ---------- */
const tasks=()=>list('task');
const isRep=t=>t.repeat==='weekly';
const plain=()=>tasks().filter(t=>!isRep(t));
const visible=()=>plain().filter(t=>UI.filter==='Все'||t.list===UI.filter);
const dow=s=>new Date(s+'T12:00').getDay();
const PODOW=['по воскресеньям','по понедельникам','по вторникам','по средам','по четвергам','по пятницам','по субботам'];
const LCOL=['#039be5','#ad1457','#0b8043','#f4511e','#8e24aa','#3f51b5','#e67c73','#c0ca33'];
const listColor=l=>{const i=META().lists.indexOf(l);return i<0?'#616161':LCOL[i%LCOL.length]};
const hm=s=>s?s.replace(/^0(\d)/,'$1'):'';
const trange=t=>t.time?hm(t.time)+(t.end&&t.end>t.time?'–'+hm(t.end):''):'';
function occurs(t,d){if(!t.date)return false;if(!isRep(t))return t.date===d;if(d<t.date||(t.until&&d>t.until)||(t.skip||[]).includes(d)||dow(d)!==dow(t.date))return false;const ev=+t.every||1;return ev<2||Math.round((new Date(d+'T12:00')-new Date(t.date+'T12:00'))/6048e5)%ev===0}
const repLabel=t=>(+t.every>1?'раз в '+t.every+' недели ':'')+PODOW[dow(t.date)];
const repOpts=sel=>[['','Не повторять'],['1','Каждую неделю'],['2','Раз в 2 недели'],['3','Раз в 3 недели'],['4','Раз в 4 недели']].map(([v,l])=>`<option value="${v}"${String(sel)===v?' selected':''}>${l}</option>`).join('');
function dayItems(d){return tasks().filter(t=>occurs(t,d)).map(t=>isRep(t)?{...t,_occ:d,done:(t.doneDates||[]).includes(d)}:t)}
function nextOcc(t){for(let i=0;i<8;i++){const d=addDays(TODAY,i);if(occurs(t,d))return d}return t.date}
const narrow=()=>window.matchMedia('(max-width:700px)').matches;
const byWhen=(a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||(a.time||'99').localeCompare(b.time||'99')||(b.prio||0)-(a.prio||0)||(a.created||0)-(b.created||0);
function weekOpts(sel,blank){const ws=[THISW,NEXTW,addDays(THISW,14),addDays(THISW,21)];if(sel&&!ws.includes(sel))ws.push(sel);ws.sort();
 return (blank?`<option value=""${!sel?' selected':''}>— без недели</option>`:'')+ws.map(w=>`<option value="${w}"${w===sel?' selected':''}>${w===THISW?'Эта неделя':w===NEXTW?'Следующая':range(w)} (${range(w)})</option>`).join('')}
function taskLi(t,hideWhen){const rep=isRep(t),oc=t._occ;
 if(!rep&&UI.editing===t.id){const m=META();return `<li class="task"><form class="tedit" data-form="edit" data-id="${t.id}">
  <input type="text" id="e_title" class="grow" value="${esc(t.title)}" required aria-label="Задача">
  <label class="ck">День <input type="date" id="e_date" value="${esc(t.date||'')}" aria-label="Дата"></label>
  <label class="ck">с <input type="time" id="e_time" value="${esc(t.time||'')}" aria-label="Начало"></label><label class="ck">до <input type="time" id="e_end" value="${esc(t.end||'')}" aria-label="Конец"></label>
  <label class="ck">или неделя <select id="e_week" aria-label="Неделя">${weekOpts(t.week||'',true)}</select></label>
  <select id="e_list" aria-label="Список">${opts(m.lists,t.list)}</select>
  <label class="ck"><input type="checkbox" id="e_prio"${t.prio?' checked':''}> Важно</label>
  <button class="btn">Сохранить</button><button type="button" class="btn plain" data-act="cancel">Отмена</button></form></li>`}
 const late=!rep&&!t.done&&((t.date&&t.date<TODAY)||(t.week&&t.week<THISW));
 let when='';
 if(rep)when=`<span class="tag">${oc&&oc!==TODAY?fmtD(oc)+' ':''}${trange(t)||'весь день'}</span><span>${oc?(+t.every>1?'раз в '+t.every+' нед.':'повторяется'):repLabel(t)}</span>`;
 else if(t.date)when=`<span class="tag${late?' late':''}">${fmtD(t.date)}${t.time?' '+trange(t):''}</span>`;
 else if(t.week&&!hideWhen)when=`<span class="tag${late?' late':''}">${wname(t.week)}</span>`;
 const ed=rep?`data-act="evedit" data-id="${t.id}" data-d="${oc||nextOcc(t)}"`:`data-act="edit" data-id="${t.id}"`;
 const del=rep?(oc?`data-act="evskip" data-id="${t.id}" data-d="${oc}" aria-label="Убрать на этот день"`:`data-act="evdel" data-id="${t.id}" aria-label="Удалить расписание"`):`data-act="deltask" data-id="${t.id}" aria-label="Удалить"`;
 const chk=rep&&!oc?`<span class="chk" style="border:0;background:${listColor(t.list)};cursor:default"></span>`:`<button class="chk" data-act="toggle" data-id="${t.id}"${oc?` data-d="${oc}"`:''} aria-label="${t.done?'Вернуть':'Выполнено'}"></button>`;
 return `<li class="task${t.done?' done':''}">${chk}
 <div class="tbody" ${ed}><div class="tt">${esc(t.title)}</div><div class="tm">${t.prio?'<span class="tag hot">важно</span>':''}${when}${t.list?`<span><i class="ldot" style="background:${listColor(t.list)}"></i>${esc(t.list)}</span>`:''}</div></div>
 <button class="x" ${del}>×</button></li>`}
const tlist=(arr,emptyMsg,hideWhen)=>arr.length?`<ul class="tasks">${arr.sort(byWhen).map(t=>taskLi(t,hideWhen)).join('')}</ul>`:(emptyMsg?`<div class="empty">${emptyMsg}</div>`:'');
function quickAdd(pre,defMode,defDate,defWeek){const m=META();const mode=UI.mode[pre]||defMode;
 return `<form class="row" data-form="add" data-p="${pre}" data-mode="${mode}">
 <input type="text" id="${pre}_title" class="grow" placeholder="${mode==='week'?'Что сделать за неделю?':'Что нужно сделать?'}" required aria-label="Новая задача">
 <div class="seg mini"><button type="button" class="${mode==='day'?'on':''}" data-act="mode" data-p="${pre}" data-v="day">На день</button><button type="button" class="${mode==='week'?'on':''}" data-act="mode" data-p="${pre}" data-v="week">На неделю</button></div>
 ${mode==='day'?(pre==='c'?'':`<input type="date" id="${pre}_date" value="${defDate||''}" aria-label="Дата">`)+`<label class="ck">с <input type="time" id="${pre}_time" aria-label="Начало"></label><label class="ck">до <input type="time" id="${pre}_end" aria-label="Конец"></label><select id="${pre}_rep" aria-label="Повтор">${repOpts('')}</select>`:`<select id="${pre}_week" aria-label="Неделя">${weekOpts(defWeek||THISW)}</select>`}
 <select id="${pre}_list" aria-label="Список">${opts(m.lists,UI.filter!=='Все'?UI.filter:m.lists[0])}</select>
 <label class="ck"><input type="checkbox" id="${pre}_prio"> Важно</label>
 <button class="btn">Добавить</button></form>`}

/* ---------- money ---------- */
const txs=()=>list('tx');
const isSaveOk=t=>t.type==='save'&&goalById(t.goalId);
function goalSaved(id){return sum(txs().filter(t=>t.type==='save'&&t.goalId===id))}
function monthStats(y,m){const k=ym(y,m);const tx=txs().filter(t=>(t.date||'').startsWith(k));
 const inc=sum(tx.filter(t=>t.type==='in')),out=sum(tx.filter(t=>t.type==='out')),sav=sum(tx.filter(isSaveOk));return{tx,inc,out,sav,left:inc-out-sav}}
function onHand(){const t=txs();return sum(t.filter(x=>x.type==='in'))-sum(t.filter(x=>x.type==='out'))-sum(t.filter(isSaveOk))}
function goalsView(manage){const g=goals();const tot=g.reduce((s,x)=>s+(+x.pct||0),0);
 let h=g.length?'':'<div class="empty">Целей пока нет.</div>';
 h+=g.map((x,i)=>{const s=goalSaved(x.id),p=x.target>0?Math.max(0,Math.min(100,s/x.target*100)):0;
  if(manage&&UI.editGoal===x.id)return `<form class="goal gform" data-form="goal" data-id="${x.id}"><input class="gn" type="text" id="ge_name" value="${esc(x.name)}" required aria-label="Название"><input type="text" inputmode="numeric" id="ge_target" value="${x.target||''}" placeholder="Нужно, ₽" aria-label="Сколько нужно"><input type="text" inputmode="numeric" id="ge_pct" value="${x.pct||0}" aria-label="Процент от дохода"><div class="row"><button class="btn">Сохранить</button><button type="button" class="btn plain" data-act="cancelgoal">Отмена</button></div></form>`;
  return `<div class="goal"><div class="gh"><b>${esc(x.name)}</b>${manage?`<span class="row" style="gap:0"><button class="chip" data-act="editgoal" data-id="${x.id}">Изменить</button><button class="x" data-act="delgoal" data-id="${x.id}" aria-label="Удалить цель">×</button></span>`:''}</div>
  <div class="gs"><b>${rub(s)}</b>${x.target>0?`из ${rub(x.target)} · ${Math.round(p)}%`:'накоплено'}${x.pct>0?` · <span class="tag">${x.pct}% с дохода</span>`:''}</div>
  ${x.target>0?`<div class="bar${i%2?' v':''}"><i style="width:${p}%"></i></div>`:''}</div>`}).join('');
 if(manage){h+=`<div class="sec">Новая цель</div><form class="gform" data-form="newgoal"><input class="gn" type="text" id="gn_name" placeholder="Например: Ноутбук, Подушка" required aria-label="Название цели"><input type="text" inputmode="numeric" id="gn_target" placeholder="Нужно, ₽" aria-label="Сколько нужно"><input type="text" inputmode="numeric" id="gn_pct" placeholder="% с дохода" aria-label="Процент от каждого дохода"><button class="btn ghost">+ Добавить цель</button></form>
 ${tot>100?`<div class="warn">Сумма процентов ${tot}% — это больше 100% дохода.</div>`:`<div class="note">С каждого дохода автоматически откладывается ${tot}%. Процент можно поставить 0 — тогда копилка пополняется только вручную.</div>`}`}
 return h}
function bars(pairs,cls){const max=Math.max(1,...pairs.map(p=>p[1]));if(!pairs.length)return'<div class="empty">Пока пусто</div>';
 return pairs.sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="brow"><span>${esc(k)}</span><div class="bar ${cls}"><i style="width:${v/max*100}%"></i></div><b>${rub(v)}</b></div>`).join('')}
function group(tx,key){const o={};tx.forEach(t=>{const k=t[key]||'Другое';o[k]=(o[k]||0)+(+t.amount||0)});return Object.entries(o)}
function statsHtml(st,withHand){return `<div class="stats">
 <div class="stat"><span>Доход</span><b class="pos">${rub(st.inc)}</b></div>
 <div class="stat"><span>Расходы</span><b class="neg">${rub(st.out)}</b></div>
 <div class="stat"><span>Отложено</span><b>${rub(st.sav)}</b></div>
 <div class="stat"><span>Осталось за месяц</span><b class="${st.left<0?'neg':''}">${rub(st.left)}</b></div>
 ${withHand?`<div class="stat"><span>На руках всего</span><b class="${onHand()<0?'neg':''}">${rub(onHand())}</b></div>`:''}</div>`}

/* ---------- views ---------- */
const V={};
V.today=()=>{const open=plain().filter(t=>!t.done);const todAll=dayItems(TODAY);
 const late=open.filter(t=>t.date&&t.date<TODAY),oldw=open.filter(t=>t.week&&t.week<THISW),tod=todAll.filter(t=>!t.done),soon=open.filter(t=>t.date>TODAY&&t.date<=WEEK);
 const wk=plain().filter(t=>t.week===THISW),wkOpen=wk.filter(t=>!t.done);
 const doneToday=todAll.filter(t=>t.done);const st=monthStats(now.getFullYear(),now.getMonth());
 const d=now.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
 return `<div class="hero"><h1 class="cap">${d}</h1><p>${tod.length?`На сегодня ${tod.length} ${plural(tod.length,'задача','задачи','задач')}`:'На сегодня задач нет'} · на неделе ещё ${wkOpen.length} ${plural(wkOpen.length,'общая','общие','общих')}${late.length+oldw.length?` · просрочено ${late.length+oldw.length}`:''}</p></div>
 <div class="grid"><div class="col"><div class="card"><h2>Сегодня</h2>${quickAdd('q','day',TODAY)}
 ${late.length?`<div class="sec bad">Просрочено</div>${tlist(late)}`:''}
 ${oldw.length?`<div class="sec bad">Не успела на прошлой неделе</div>${tlist(oldw)}`:''}
 <div class="sec">На сегодня</div>${tlist(tod,'Свободный день — или добавь задачу выше.')}
 ${doneToday.length?`<div class="sec">Готово</div>${tlist(doneToday)}`:''}</div>
 <div class="card"><h2>Ближайшие дни</h2><div class="note" style="margin:-8px 0 6px">Без повторяющихся пар — они в «Календаре».</div>${tlist(soon,'На ближайшие дни ничего не запланировано.')}</div></div>
 <div class="col"><div class="card"><h2>Задачи на неделю <span style="color:var(--mut);font-size:14px;font-family:Manrope">${range(THISW)}</span></h2>${quickAdd('w','week')}<div style="height:6px"></div>${tlist(wk,'Общих задач на неделю пока нет.',true)}</div>
 <div class="card"><h2 class="cap">${now.toLocaleDateString('ru-RU',{month:'long'})}: деньги</h2>${statsHtml(st)}
 <div class="row" style="margin-top:14px"><button class="btn ghost" data-act="tab" data-t="money">Добавить операцию</button><button class="btn plain" data-act="tostats">Статистика трат</button></div></div>
 <div class="card"><h2>Цели</h2>${goalsView(false)}</div></div></div>`};

V.tasks=()=>{const m=META();const vis=visible();const open=vis.filter(t=>!t.done),done=vis.filter(t=>t.done);
 const g=[['Просрочено',open.filter(t=>t.date&&t.date<TODAY),1],['Не успела на прошлых неделях',open.filter(t=>t.week&&t.week<THISW),1],
  ['Сегодня',open.filter(t=>t.date===TODAY)],['Завтра',open.filter(t=>t.date===TOM)],['Общие на этой неделе · '+range(THISW),open.filter(t=>t.week===THISW),0,1],
  ['Дальше на неделе',open.filter(t=>t.date>TOM&&t.date<=WEEK)],['Общие на следующей неделе · '+range(NEXTW),open.filter(t=>t.week===NEXTW),0,1],
  ['Позже',open.filter(t=>t.date>WEEK||t.week>NEXTW)],['Без срока',open.filter(t=>!t.date&&!t.week)]];
 const series=tasks().filter(t=>isRep(t)&&(UI.filter==='Все'||t.list===UI.filter)).sort((a,b)=>((dow(a.date)+6)%7)-((dow(b.date)+6)%7)||(a.time||'').localeCompare(b.time||''));
 return `<div class="hero"><h1>Задачи</h1><p>${open.length} ${plural(open.length,'открытая','открытые','открытых')}</p></div>
 <div class="card">${quickAdd('t','day','')}
 <div class="chips">${['Все',...m.lists].map(l=>`<button class="chip${UI.filter===l?' on':''}" data-act="filter" data-l="${esc(l)}">${esc(l)}</button>`).join('')}</div>
 ${open.length?g.filter(x=>x[1].length).map(([n,a,bad,hw])=>`<div class="sec${bad?' bad':''}">${n}<span>${a.length}</span></div>${tlist(a,'',hw)}`).join(''):'<div class="empty">Всё сделано. Можно выдохнуть.</div>'}
 ${series.length?`<div class="sec">Расписание — повторяется<span>${series.length}</span></div><ul class="tasks">${series.map(t=>taskLi(t)).join('')}</ul>`:''}
 ${done.length?`<div class="sec"><button class="chip" data-act="showdone">${UI.showDone?'Скрыть':'Показать'} выполненные (${done.length})</button></div>${UI.showDone?tlist(done):''}`:''}</div>`};

function monthView(){const y=UI.calY,mo=UI.calM;const first=new Date(y,mo,1);const start=new Date(y,mo,1-((first.getDay()+6)%7));
 let cells='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);if(i===35&&d.getMonth()!==mo)break;const k=iso(d);const ts=dayItems(k).sort(byWhen);

function weekView(){const nr=narrow(),n=nr?3:7;const s=n===7?monday(UI.sel):UI.sel;const days=[...Array(n)].map((_,i)=>addDays(s,i));
 const items=days.map(d=>dayItems(d));
 let mn=8*60,mx=21*60;items.flat().forEach(t=>{if(t.time){const a=toM(t.time),b=t.end&&t.end>t.time?toM(t.end):a+60;mn=Math.min(mn,a);mx=Math.max(mx,b)}});
 const H0=Math.floor(mn/60),H1=Math.min(24,Math.ceil(mx/60)),PH=nr?44:48;const nowM=now.getHours()*60+now.getMinutes();
 const title=range(s).replace(/^(\d+)–(.*)$/,'$1–$2')&&(()=>{const a=new Date(days[0]+'T12:00'),z=new Date(days[n-1]+'T12:00');return a.getMonth()===z.getMonth()?a.getDate()+'–'+short(days[n-1]):short(days[0])+' – '+short(days[n-1])})();
 const hdr=days.map(d=>{const dt=new Date(d+'T12:00');return `<button class="wkd${d===TODAY?' today':''}${d===UI.sel?' sel':''}" data-act="sel" data-d="${d}" aria-label="${dt.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}"><span>${dt.toLocaleDateString('ru-RU',{weekday:'short'})}</span><b>${dt.getDate()}</b></button>`}).join('');
 const allDay=items.map(its=>its.filter(t=>!t.time));const hasAll=allDay.some(a=>a.length);
 const cols=days.map((d,di)=>{const timed=items[di].filter(t=>t.time).map(t=>{const a=toM(t.time);return{t,a,b:t.end&&t.end>t.time?toM(t.end):a+60}}).sort((x,y)=>x.a-y.a||y.b-x.b);
  const out=[];let cl=[],cEnd=-1;const flush=()=>{const ends=[];cl.forEach(e=>{let l=ends.findIndex(x=>x<=e.a);if(l<0){l=ends.length;ends.push(0)}ends[l]=e.b;e.l=l});cl.forEach(e=>e.n=ends.length);out.push(...cl);cl=[]};
  timed.forEach(e=>{if(cl.length&&e.a>=cEnd){flush();cEnd=-1}cl.push(e);cEnd=Math.max(cEnd,e.b)});flush();
  const evs=out.map(e=>{const top=(e.a-H0*60)/60*PH,ht=Math.max((e.b-e.a)/60*PH-2,20);const past=d<TODAY||(d===TODAY&&e.b<=nowM);
   return `<button class="ev${ht<38?' sm':''}${past?' past':''}${e.t.done?' done':''}" style="top:${top}px;height:${ht}px;left:calc(${e.l} * 100% / ${e.n} + 1px);width:calc(100% / ${e.n} - 3px);background:${listColor(e.t.list)}" data-act="evedit" data-id="${e.t.id}" data-d="${d}" title="${esc(e.t.title)} ${trange(e.t)}"><b style="-webkit-line-clamp:${Math.max(1,Math.floor((ht-22)/15))}">${esc(e.t.title)}</b><span>${trange(e.t)}</span></button>`}).join('');
  const nl=d===TODAY&&nowM>=H0*60&&nowM<=H1*60?`<div class="nowl" style="top:${(nowM-H0*60)/60*PH}px"></div>`:'';
  return `<div class="wkcol" data-act="slot" data-d="${d}" data-h0="${H0}" data-ph="${PH}">${evs}${nl}</div>`}).join('');
 const times=[];for(let hh=H0+1;hh<H1;hh++)times.push(`<span style="top:${(hh-H0)*PH}px">${hh}:00</span>`);
 const sw=monday(UI.sel);const wk=plain().filter(t=>t.week===sw);
 return `${cviewSeg()}<div class="mhead"><button class="arrow" data-act="wk" data-v="-1" aria-label="Назад">‹</button><h2>${title}</h2><button class="arrow" data-act="wk" data-v="1" aria-label="Вперёд">›</button><button class="chip" data-act="caltoday">Сегодня</button><button class="btn" data-act="evnew">+ Событие</button>${'documentPictureInPicture' in window&&!pipWin?'<button class="btn ghost" data-act="pip">Виджет поверх окон</button>':''}</div>
 ${UI.ev?evEditor():''}
 <div class="wk" style="--n:${n};--h:${PH}px;--total:${(H1-H0)*PH}px"><div class="wkhead"><div></div>${hdr}</div>
 ${hasAll?`<div class="wkall"><div class="lbl">весь день</div>${allDay.map((a,i)=>`<div>${a.map(t=>`<button class="chipev${t.done?' done':''}" style="background:${listColor(t.list)}${t.done?';opacity:.5':''}" data-act="evedit" data-id="${t.id}" data-d="${days[i]}">${esc(t.title)}</button>`).join('')}</div>`).join('')}</div>`:''}
 <div class="wkbody"><div class="wktimes">${times.join('')}</div>${cols}</div></div>
 <div class="wkhint">Нажми на пустое место в сетке, чтобы добавить событие в это время. Нажми на событие, чтобы изменить его или отметить выполненным.</div>

/* ---------- spending statistics ---------- */
const C=2*Math.PI*80;
function catKey(cat,cats){const i=cats.indexOf(cat);if(i<0)return'Остальное';if(cats.length>8&&i>=7)return'Остальное';return cat}
function catCol(k,cats){return k==='Остальное'?'var(--c0)':`var(--c${cats.indexOf(k)+1})`}
function groupOut(tx,cats){const o={};tx.forEach(t=>{const k=catKey(t.cat,cats);(o[k]=o[k]||{k,amt:0,n:0});o[k].amt+=+t.amount||0;o[k].n++});return o}
function catBars(tx){const cats=META().cats;const g=Object.values(groupOut(tx,cats)).sort((a,b)=>b.amt-a.amt);if(!g.length)return'<div class="empty">Пока пусто</div>';const max=g[0].amt;
 return g.map(x=>`<div class="brow"><span>${esc(x.k)}</span><div class="bar"><i style="width:${x.amt/max*100}%;background:${catCol(x.k,cats)}"></i></div><b>${rub(x.amt)}</b></div>`).join('')}
const mshort=(y,m)=>new Date(y,m,1).toLocaleDateString('ru-RU',{month:'short'}).replace('.','');
function statsView(){const cats=META().cats,yr=UI.speriod==='year',y=UI.mY,mo=UI.mM;
 const key=yr?String(y):ym(y,mo);const pd=new Date(y,mo-1,1);const pkey=yr?String(y-1):ym(pd.getFullYear(),pd.getMonth());
 const isNow=yr?y===now.getFullYear():(y===now.getFullYear()&&mo===now.getMonth());
 const cut=isNow?(yr?(y-1)+TODAY.slice(4):pkey+TODAY.slice(7)):'9999';
 const out=txs().filter(t=>t.type==='out');const cur=out.filter(t=>(t.date||'').startsWith(key)),prev=out.filter(t=>(t.date||'').startsWith(pkey)&&t.date<=cut);
 const total=sum(cur),ptotal=sum(prev);const G=groupOut(cur,cats),PG=groupOut(prev,cats);const sorted=Object.values(G).sort((a,b)=>b.amt-a.amt);
 const sel=UI.scat&&G[UI.scat]?UI.scat:null;
 const days=yr?(isNow?Math.floor((now-new Date(y,0,1))/864e5)+1:((y%4===0&&y%100!==0)||y%400===0?366:365)):(isNow?now.getDate():new Date(y,mo+1,0).getDate());

 const delta=(a,b)=>{if(!b)return'';const d=a-b,pc=Math.round(Math.abs(d)/b*100);return d===0?'как в '+(yr?'прошлом году':'прошлом месяце'):`<span class="delta ${d>0?'up':'down'}">${d>0?'↑ больше':'↓ меньше'} на ${rub(Math.abs(d))} (${pc}%) к ${pl}</span>`};
 const head=`${subnav()}<div class="mhead"><button class="arrow" data-act="mon" data-v="-1" aria-label="Назад">‹</button><h2 class="cap">${yr?y+' год':monthName(y,mo)}</h2><button class="arrow" data-act="mon" data-v="1" aria-label="Вперёд">›</button>
 <div class="seg mini"><button class="${!yr?'on':''}" data-act="speriod" data-v="month">Месяц</button><button class="${yr?'on':''}" data-act="speriod" data-v="year">Год</button></div></div>`;
 if(!total)return head+`<div class="card"><h2>Трат пока нет</h2><div class="empty">${cur.length?'':'Добавь расходы во вкладке «Учёт» — здесь появится круг по категориям, сравнение с '+pl+' и самые крупные траты.'}</div>${ptotal?`<div class="note">В ${yr?'прошлом году':'прошлом месяце'} было потрачено ${rub(ptotal)}.</div>`:''}<button class="btn" style="margin-top:12px" data-act="msub" data-v="ledger">Добавить расход</button></div>`;
 // donut
 let off=0;const gap=sorted.length>1?2.5:0;

 // trend bars

 const vals=cols.map(([cy,cm])=>sum(out.filter(t=>(t.date||'').startsWith(ym(cy,cm))&&(!sel||catKey(t.cat,cats)===sel))));const vmax=Math.max(1,...vals);

 return head+`<div class="card"><div class="headline"><div><div class="note" style="margin:0 0 6px">Потрачено ${yr?'за год':'за месяц'}</div><div class="big">${rub(total)}</div></div>

V.set=()=>{const m=META();const c=DB.cfg;
 const syncCard=!c.url?`<p class="note" style="margin-top:0">Чтобы телефон и ноутбук видели одни и те же данные, подключи бесплатную базу Supabase (инструкция в README). Без неё всё хранится только на этом устройстве.</p>

 :!session?`<p class="note" style="margin-top:0">База подключена. Войди — на всех устройствах один и тот же аккаунт.</p>
 <form class="row" data-form="auth"><input type="email" id="au_email" class="full" placeholder="Почта" autocomplete="email" required><input type="password" id="au_pass" class="full" placeholder="Пароль (от 6 символов)" autocomplete="current-password" required>
 <button class="btn">Войти</button><button type="button" class="btn ghost" data-act="signup">Создать аккаунт</button><button type="button" class="btn plain" data-act="unlink">Отключить базу</button></form>`
 :`<p style="margin:0">Вход выполнен: <b>${esc(session.user.email)}</b></p><p class="note">${esc(syncMsg)}</p><div class="row"><button class="btn ghost" data-act="syncnow">Синхронизировать сейчас</button><button class="btn plain" data-act="signout">Выйти</button></div>`;
 const feedCard=!session?'<p class="note" style="margin-top:0">Сначала подключи синхронизацию — календарь для виджета берёт задачи из базы.</p>'
 :UI.feed?`<p style="margin-top:0">Твоя ссылка на календарь (никому её не показывай):</p><input type="text" class="full" readonly value="${esc(UI.feed)}" id="feedurl"><div class="row" style="margin-top:8px"><button class="btn ghost" data-act="copyfeed">Скопировать</button><a class="btn plain" style="text-decoration:none;display:inline-grid;place-items:center" href="${esc(UI.feed.replace(/^https:/,'webcal:'))}">Подписаться (iPhone)</a></div>
 <div class="note"><b>iPhone:</b> нажми «Подписаться» или: Настройки → Календарь → Учётные записи → Добавить → Другое → Подписной календарь → вставь ссылку. Потом добавь на экран виджет «Календарь».<br><b>Android:</b> открой calendar.google.com на ноутбуке → «Другие календари» → «+» → «Добавить по URL» → вставь ссылку. Потом виджет Google Календаря на экране. Google обновляет такие календари медленно — изменения могут появиться через несколько часов.</div>`
 :`<p class="note" style="margin-top:0">Задачи с датой будут видны в обычном календаре телефона и в его виджете.</p><button class="btn ghost" data-act="getfeed">Получить ссылку на календарь</button>`;
 return `<div class="hero"><h1>Настройки</h1><p>Списки, источники дохода, категории, синхронизация и виджет.</p></div>
 <div class="grid"><div class="col"><form data-form="set" class="card"><h2>Списки и категории</h2>
 <label class="note" for="s_lists">Списки задач (через запятую)</label><input type="text" id="s_lists" class="full" value="${esc(m.lists.join(', '))}">
 <label class="note" for="s_sources" style="display:block">Источники дохода</label><input type="text" id="s_sources" class="full" value="${esc(m.sources.join(', '))}">
 <label class="note" for="s_cats" style="display:block">Категории расходов</label><input type="text" id="s_cats" class="full" value="${esc(m.cats.join(', '))}">
 <div style="margin-top:14px"><button class="btn">Сохранить</button></div><div class="note">Цели и копилки — во вкладке «Деньги».</div></form>
 <div class="card"><h2>Виджет на ноутбук</h2><p class="note" style="margin-top:0">Компактное окно «Мой день»: часы, расписание по времени, что сейчас и что дальше.</p>
 <div class="row"><button class="btn" data-act="pip">Закрепить поверх окон</button><button class="btn ghost" data-act="wgwin">Открыть отдельным окном</button></div>
 <div class="note"><b>Поверх окон</b> — маленькое окошко, которое всегда видно над другими программами (Chrome, Edge, Яндекс Браузер). Работает, пока открыт планер.<br><b>Отдельным окном</b> — обычное окно, его можно поставить сбоку экрана. Ещё быстрее: правый клик по иконке установленного планера → «Виджет: мой день».</div></div>
 <div class="card"><h2>Как поставить приложение</h2><div class="note" style="margin:0"><b>iPhone (Safari):</b> «Поделиться» → «На экран “Домой”».<br><b>Android (Chrome):</b> меню ⋮ → «Установить приложение».<br><b>Ноутбук (Chrome / Edge / Яндекс):</b> значок установки справа в адресной строке.</div></div>
 <div class="card"><h2>Резервная копия</h2><div class="row"><button class="btn ghost" data-act="export">Скачать копию</button><button class="btn plain" data-act="import">Загрузить копию</button></div><div class="note">Загрузка добавляет данные из файла к текущим, ничего не стирая.</div></div></div>
 <div class="col"><div class="card"><h2>Синхронизация</h2>${syncCard}</div><div class="card"><h2>Виджет календаря на телефоне</h2>${feedCard}</div></div></div>`};

/* ---------- desktop widget ---------- */
const WIDGET=/[?&]widget/.test(location.search)||location.hash==='#widget';
let pipWin=null,wgScroll=null;
function widgetHTML(){setToday();const d=UI.wday==='tom'?TOM:TODAY;const its=dayItems(d);const nowM=now.getHours()*60+now.getMinutes();
 const timed=its.filter(t=>t.time).map(t=>{const a=toM(t.time);return{t,a,b:t.end&&t.end>t.time?toM(t.end):a+60}}).sort((x,y)=>x.a-y.a);
 const untimed=its.filter(t=>!t.time);
 let mn=8*60,mx=21*60;timed.forEach(e=>{mn=Math.min(mn,e.a);mx=Math.max(mx,e.b)});const H0=Math.floor(mn/60),H1=Math.min(24,Math.ceil(mx/60)),PH=42;
 // lanes
 const out=[];let cl=[],cEnd=-1;const flush=()=>{const ends=[];cl.forEach(e=>{let l=ends.findIndex(x=>x<=e.a);if(l<0){l=ends.length;ends.push(0)}ends[l]=e.b;e.l=l});cl.forEach(e=>e.n=ends.length);out.push(...cl);cl=[]};
 timed.forEach(e=>{if(cl.length&&e.a>=cEnd){flush();cEnd=-1}cl.push(e);cEnd=Math.max(cEnd,e.b)});flush();
 const evs=out.map(e=>{const top=(e.a-H0*60)/60*PH,ht=Math.max((e.b-e.a)/60*PH-2,20);const past=d===TODAY&&e.b<=nowM;
  return `<button class="ev${ht<36?' sm':''}${past?' past':''}${e.t.done?' done':''}" style="top:${top}px;height:${ht}px;left:calc(${e.l} * 100% / ${e.n} + 2px);width:calc(100% / ${e.n} - 4px);right:auto;background:${listColor(e.t.list)}" data-act="wgtoggle" data-id="${e.t.id}" data-d="${d}" title="Нажми, чтобы отметить выполненным"><b>${esc(e.t.title)}</b><span>${trange(e.t)}</span></button>`}).join('');
 const nl=d===TODAY&&nowM>=H0*60&&nowM<=H1*60?`<div class="nowl" style="top:${(nowM-H0*60)/60*PH}px"></div>`:'';
 const tms=[];for(let hh=H0+1;hh<H1;hh++)tms.push(`<span class="tm" style="top:${(hh-H0)*PH}px">${hh}:00</span>`);
 // now / next
 let info='';
 if(d===TODAY){const cur=timed.filter(e=>e.a<=nowM&&nowM<e.b&&!e.t.done);const nx=timed.find(e=>e.a>nowM&&!e.t.done);
  const dur=m=>m<60?m+' мин':Math.floor(m/60)+' ч'+(m%60?' '+(m%60)+' мин':'');
  if(cur.length)info+=cur.map(e=>`<div><i style="background:#6ff0b0"></i>Сейчас: <b>${esc(e.t.title)}</b> · до ${hm(fromM(e.b))}</div>`).join('');
  if(nx)info+=`<div${cur.length?' style="margin-top:4px"':''}><i style="background:${listColor(nx.t.list)}"></i>Далее в ${hm(nx.t.time)}: <b>${esc(nx.t.title)}</b><small>через ${dur(nx.a-nowM)}</small></div>`;
  if(!info)info=timed.length?'<div>На сегодня по расписанию всё. Можно отдыхать.</div>':'<div>Сегодня по расписанию ничего нет.</div>'}
 else{info=timed.length?`<div>Завтра первое: <b>${esc(timed[0].t.title)}</b> в ${hm(timed[0].t.time)}<small>всего ${timed.length} ${plural(timed.length,'событие','события','событий')}</small></div>`:'<div>Завтра по расписанию ничего нет.</div>'}
 const wk=plain().filter(t=>t.week===THISW&&!t.done);
 return `<div class="wg"><div class="wghead"><div class="wgclock">${pad(now.getHours())}:${pad(now.getMinutes())}</div><div class="wgdate">${new Date(d+'T12:00').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</div><div class="wgnow">${info}</div></div>
 <div class="wgtabs"><button class="chip${UI.wday!=='tom'?' on':''}" data-act="wday" data-v="today">Сегодня</button><button class="chip${UI.wday==='tom'?' on':''}" data-act="wday" data-v="tom">Завтра</button><span class="sp"></span>${pipWin&&!WIDGET?'':`<button class="link" data-act="openapp">Открыть планер</button>`}</div>
 <div class="wgscroll">${untimed.length?`<div class="wgsec">Без времени</div>${untimed.map(t=>`<div class="wgtask${t.done?' done':''}"><button class="chk" data-act="wgtoggle" data-id="${t.id}"${t._occ?` data-d="${d}"`:''} aria-label="Выполнено"></button><span>${esc(t.title)}</span></div>`).join('')}`:''}
 ${timed.length?`<div class="wgtl" style="height:${(H1-H0)*PH}px;--wh:${PH}px">${tms.join('')}${evs}${nl}</div>`:`<div class="wgempty">Нет событий со временем</div>`}
 ${wk.length?`<div class="wgsec">Задачи на неделю · ${wk.length}</div>${wk.slice(0,6).map(t=>`<div class="wgtask"><button class="chk" data-act="wgtoggle" data-id="${t.id}" aria-label="Выполнено"></button><span>${esc(t.title)}</span></div>`).join('')}`:''}</div>
 <div class="wgfoot">${!pipWin&&'documentPictureInPicture' in window?`<button class="btn ghost" data-act="pip">Закрепить поверх окон</button>`:''}<span>${UI.wday==='tom'?'':'Нажми на событие — отметить выполненным'}</span></div></div>`}
function renderWidget(target){const sc=target.querySelector('.wgscroll');const st=sc?sc.scrollTop:null;target.innerHTML=widgetHTML();const nsc=target.querySelector('.wgscroll');
 if(nsc){if(st!==null&&wgScroll!=='reset')nsc.scrollTop=st;else{const nl=nsc.querySelector('.nowl');const ev=nsc.querySelector('.ev:not(.past)');const y=nl?nl.offsetTop:ev?ev.offsetTop:0;nsc.scrollTop=Math.max(0,y-90)}wgScroll=null}}
function wgClick(e){const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
 if(a==='wgtoggle'){const t=DB.items[id];if(!t)return;const d=b.dataset.d;if(isRep(t)&&d){const dd=t.doneDates||[];save({...t,doneDates:dd.includes(d)?dd.filter(x=>x!==d):[...dd,d]})}else save({...t,done:!t.done})}
 else if(a==='wday'){UI.wday=b.dataset.v;wgScroll='reset';render()}
 else if(a==='openapp'){if(WIDGET){window.open('./','_blank')}else{window.focus()}}
 else if(a==='pip'){openPip()}}
async function openPip(){if(!('documentPictureInPicture' in window)){toast('Этот браузер не умеет окна поверх других. Подойдут Chrome, Edge или Яндекс Браузер.');return}
 try{const w=await documentPictureInPicture.requestWindow({width:360,height:600});pipWin=w;
  document.querySelectorAll('style,link[rel=stylesheet]').forEach(n=>w.document.head.appendChild(n.cloneNode(true)));
  const m=w.document.createElement('meta');m.name='color-scheme';m.content='light dark';w.document.head.appendChild(m);
  w.document.title='Мой день';w.document.body.className='wmode';w.document.body.style.margin='0';w.document.body.innerHTML='<div id="wroot"></div>';
  w.document.addEventListener('click',wgClick);w.addEventListener('pagehide',()=>{pipWin=null;render()});wgScroll='reset';render()}
 catch(err){toast('Не получилось открыть окно: '+(err.message||err))}}
setInterval(()=>{if(WIDGET||pipWin){const old=TODAY;setToday();if(WIDGET)render();else if(pipWin){renderWidget(pipWin.document.getElementById('wroot'))}if(old!==TODAY)render()}},20000);

/* ---------- render ---------- */
const main=document.getElementById('main');
function render(){if(pipWin&&!pipWin.closed){const r=pipWin.document.getElementById('wroot');if(r)renderWidget(r)}
 if(WIDGET){document.body.classList.add('wmode');renderWidget(main);return}
 const ae=document.activeElement,f=ae&&ae.id;
 main.innerHTML=(V[UI.tab]||V.today)();
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===UI.tab));
 for(const id in drafts){const el=document.getElementById(id);if(el){if(el.type==='checkbox')el.checked=drafts[id];else el.value=drafts[id]}}
 if(f){const el=document.getElementById(f);if(el&&el!==document.activeElement)el.focus()}}
const keep=e=>{const t=e.target;if(t.id&&t.id!=='importfile'&&!t.closest('[data-form="set"]'))drafts[t.id]=t.type==='checkbox'?t.checked:t.value};
document.addEventListener('input',keep);document.addEventListener('change',keep);
const clear=pre=>{for(const k in drafts)if(k.startsWith(pre))delete drafts[k]};
const val=id=>{const el=document.getElementById(id);return el?(el.type==='checkbox'?el.checked:el.value.trim()):''};
const num=s=>parseFloat(String(s).replace(/\s/g,'').replace(',','.'))||0;
const split=s=>s.split(',').map(x=>x.trim()).filter(Boolean);

document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
 if(WIDGET||['wgtoggle','wday','openapp','pip'].includes(a)){if(['wgtoggle','wday','openapp','pip'].includes(a))wgClick(e);return}
 if(a==='tab'){UI.tab=b.dataset.t;UI.editing=null;UI.editGoal=null;UI.ev=null;try{localStorage.setItem('planner-ui',JSON.stringify({tab:UI.tab}))}catch(e){}render();window.scrollTo(0,0)}
 else if(a==='toggle'){const t=DB.items[id];if(!t)return;const d=b.dataset.d;if(d){const dd=t.doneDates||[];save({...t,doneDates:dd.includes(d)?dd.filter(x=>x!==d):[...dd,d]})}else save({...t,done:!t.done})}
 else if(a==='wgwin'){const w=window.open('./?widget','planner-widget','popup,width=380,height=680');if(!w)location.href='./?widget'}
 else if(a==='cview'){UI.cview=b.dataset.v;UI.ev=null;render()}
 else if(a==='wk'){UI.sel=addDays(UI.sel,(+b.dataset.v)*(narrow()?3:7));UI.ev=null;render()}
 else if(a==='evnew'){UI.ev={date:UI.sel,time:'',end:''};clear('ev_');render();document.getElementById('ev_title')?.focus()}
 else if(a==='evcancel'){UI.ev=null;render()}
 else if(a==='evedit'){const t=DB.items[id];if(!t)return;UI.tab='cal';if(UI.cview==='month'&&!b.closest('#main .cal'))UI.cview='week';UI.sel=b.dataset.d||t.date||TODAY;UI.ev={id,date:UI.sel};clear('ev_');render();document.querySelector('.evcard')?.scrollIntoView({behavior:'smooth',block:'start'})}
 else if(a==='slot'){const r=b.getBoundingClientRect();const h0=+b.dataset.h0,ph=+b.dataset.ph;let m=h0*60+Math.floor((e.clientY-r.top)/ph*2)*30;m=Math.max(0,Math.min(m,23*60));UI.sel=b.dataset.d;UI.ev={date:b.dataset.d,time:fromM(m),end:fromM(Math.min(m+60,23*60+59))};clear('ev_');render();document.querySelector('.evcard')?.scrollIntoView({behavior:'smooth',block:'start'});document.getElementById('ev_title')?.focus({preventScroll:true})}
 else if(a==='evskip'){const t=DB.items[id];const d=b.dataset.d;if(!t||!d)return;UI.ev=null;save({...t,skip:[...(t.skip||[]),d]});toast('«'+t.title+'» убрано на '+short(d),()=>{const c=DB.items[id];save({...c,skip:(c.skip||[]).filter(x=>x!==d)})})}
 else if(a==='evdel'){const t=DB.items[id];if(!t)return;UI.ev=null;remove(id);toast(isRep(t)?'Удалены все повторы «'+t.title+'»':'Удалено «'+t.title+'»',()=>save({...t,del:false}))}
 else if(a==='edit'){UI.editing=id;clear('e_');render();const el=document.getElementById('e_title');if(el)el.focus()}
 else if(a==='cancel'){UI.editing=null;render()}
 else if(a==='deltask'){const t=DB.items[id];if(!t)return;remove(id);toast('Задача удалена',()=>save({...t,del:false}))}
 else if(a==='deltx'){const t=DB.items[id];if(!t)return;remove(id);toast('Операция удалена',()=>save({...t,del:false}))}
 else if(a==='mode'){UI.mode[b.dataset.p]=b.dataset.v;render();const el=document.getElementById(b.dataset.p+'_title');if(el)el.focus()}
 else if(a==='filter'){UI.filter=b.dataset.l;render()}
 else if(a==='showdone'){UI.showDone=!UI.showDone;render()}
 else if(a==='sel'){UI.sel=b.dataset.d;const d=new Date(UI.sel+'T12:00');UI.calY=d.getFullYear();UI.calM=d.getMonth();render()}
 else if(a==='cal'){const d=new Date(UI.calY,UI.calM+ +b.dataset.v,1);UI.calY=d.getFullYear();UI.calM=d.getMonth();render()}
 else if(a==='caltoday'){UI.calY=now.getFullYear();UI.calM=now.getMonth();UI.sel=TODAY;UI.ev=null;render()}
 else if(a==='mon'){const st=(UI.msub==='stats'&&UI.speriod==='year')?12:1;const d=new Date(UI.mY,UI.mM+st* +b.dataset.v,1);UI.mY=d.getFullYear();UI.mM=d.getMonth();render()}
 else if(a==='msub'){UI.msub=b.dataset.v;render()}
 else if(a==='tostats'){UI.tab='money';UI.msub='stats';render();window.scrollTo(0,0)}
 else if(a==='speriod'){UI.speriod=b.dataset.v;UI.scat=null;render()}
 else if(a==='scat'){UI.scat=UI.scat===b.dataset.c?null:b.dataset.c;render()}
 else if(a==='txtype'){UI.txType=b.dataset.v;render()}
 else if(a==='editgoal'){UI.editGoal=id;clear('ge_');render()}
 else if(a==='cancelgoal'){UI.editGoal=null;render()}
 else if(a==='delgoal'){const g=DB.items[id];if(!g)return;const s=goalSaved(id);remove(id);toast(s>0?`«${g.name}» удалена, ${rub(s)} вернулись в «на руках»`:`Цель «${g.name}» удалена`,()=>save({...g,del:false}))}
 else if(a==='export'){const items=Object.values(DB.items).filter(x=>!x.del);const blob=new Blob([JSON.stringify({app:'planner',v:2,items},null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='planner-'+TODAY+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
 else if(a==='import'){document.getElementById('importfile').click()}
 else if(a==='signup'||a==='signin'){auth(a==='signup')}
 else if(a==='signout'){if(sb)await sb.auth.signOut();session=null;UI.feed='';setSync('');render()}
 else if(a==='unlink'){DB.cfg={};persist();sb=null;session=null;setSync('');render()}
 else if(a==='syncnow'){sync()}
 else if(a==='getfeed'){getFeed()}
 else if(a==='copyfeed'){try{await navigator.clipboard.writeText(UI.feed);toast('Ссылка скопирована')}catch(e){const el=document.getElementById('feedurl');el.select();toast('Выделила ссылку — скопируй вручную')}}
});

document.getElementById('importfile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;
 try{const d=JSON.parse(await f.text());const items=d.items||[];let n=0;const t=Date.now();
  for(const it of items){if(!it||!it.id||!it.kind)continue;const cur=DB.items[it.id];if(cur&&!cur.del&&(cur.upd||0)>=(it.upd||0)&&it.kind!=='meta')continue;DB.items[it.id]={...it,upd:t+n};DB.dirty[it.id]=1;n++}
  persist();render();kick();toast('Загружено записей: '+n)}catch(err){toast('Не получилось прочитать файл')}e.target.value=''});

document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,k=f.dataset.form;
 if(k==='add'){const p=f.dataset.p,mode=f.dataset.mode;const title=val(p+'_title');if(!title)return;const keepList=val(p+'_list');
  const t={id:uid(),kind:'task',title,list:keepList,prio:val(p+'_prio')?1:0,done:false,created:Date.now(),date:'',week:'',time:''};
  if(mode==='week')t.week=val(p+'_week');else{t.date=p==='c'?UI.sel:val(p+'_date');t.time=val(p+'_time');t.end=t.time?val(p+'_end'):'';const rv=+val(p+'_rep');if(rv){t.repeat='weekly';t.every=rv;if(!t.date)t.date=TODAY}}
  clear(p+'_');drafts[p+'_list']=keepList;if(mode==='week')drafts[p+'_week']=t.week;save(t);const el=document.getElementById(p+'_title');if(el)el.focus()}
 else if(k==='edit'){const t=DB.items[f.dataset.id];if(!t)return;UI.editing=null;const date=val('e_date');
  const tm=date?val('e_time'):'';clear('e_');save({...t,title:val('e_title')||t.title,date,time:tm,end:tm?val('e_end'):'',week:date?'':val('e_week'),list:val('e_list'),prio:val('e_prio')?1:0})}
 else if(k==='ev'){const e=UI.ev;if(!e)return;const title=val('ev_title');if(!title)return;const time=val('ev_time');let end=time?val('ev_end'):'';
  if(end&&end<=time){toast('Конец должен быть позже начала');return}const r=+val('ev_rep');
  const fields={title,date:val('ev_date')||e.date,time,end,list:val('ev_list'),prio:val('ev_prio')?1:0,repeat:r?'weekly':'',every:r||1,until:r?val('ev_until'):'',week:''};
  const old=e.id?DB.items[e.id]:null;UI.ev=null;UI.sel=fields.date>UI.sel&&!r?fields.date:UI.sel;clear('ev_');
  if(old)save({...old,...fields});else save({id:uid(),kind:'task',done:false,created:Date.now(),...fields});toast(old?'Сохранено':(r?(r>1?'Событие добавлено: раз в '+r+' недели':'Событие добавлено на каждую неделю'):'Событие добавлено'))}
 else if(k==='tx'){const amount=num(val('m_amount'));if(amount<=0){toast('Введи сумму больше нуля');return}
  const ty=UI.txType,c=val('m_cat_'+(ty==='take'?'save':ty)),date=val('m_date')||TODAY,note=val('m_note'),created=Date.now();
  const rec={id:uid(),kind:'tx',type:ty==='take'?'save':ty,amount:ty==='take'?-amount:amount,date,note,created};
  if(ty==='in')rec.source=c;else if(ty==='out')rec.cat=c;else rec.goalId=c;
  if(ty==='take'&&amount>goalSaved(c)){toast('В копилке столько нет: '+rub(goalSaved(c)));return}
  const autoOn=ty==='in'&&val('m_auto');delete drafts.m_amount;delete drafts.m_note;save(rec);
  if(autoOn){goals().filter(g=>g.pct>0).forEach((g,i)=>{const a=Math.round(amount*g.pct/100);if(a>0)save({id:uid(),kind:'tx',type:'save',amount:a,date,goalId:g.id,note:'Авто: '+g.pct+'% от «'+c+'»',created:created+i+1})});toast('Доход записан и разложен по копилкам')}
  else toast(ty==='in'?'Доход записан':ty==='out'?'Расход записан':ty==='save'?'Отложено':'Взято из копилки')}
 else if(k==='newgoal'){const name=val('gn_name');if(!name)return;clear('gn_');save({id:uid(),kind:'goal',name,target:num(val('gn_target')),pct:Math.max(0,Math.min(100,num(val('gn_pct')))),created:Date.now()});toast('Цель добавлена')}
 else if(k==='goal'){const g=DB.items[f.dataset.id];if(!g)return;UI.editGoal=null;const upd={...g,name:val('ge_name')||g.name,target:num(val('ge_target')),pct:Math.max(0,Math.min(100,num(val('ge_pct'))))};clear('ge_');save(upd)}
 else if(k==='set'){const lists=split(val('s_lists')),sources=split(val('s_sources')),cats=split(val('s_cats'));
  save({...(DB.items.meta||{}),id:'meta',kind:'meta',lists:lists.length?lists:DEF_META.lists,sources:sources.length?sources:DEF_META.sources,cats:cats.length?cats:DEF_META.cats});toast('Сохранено')}
 else if(k==='cfg'){const url=val('cf_url').replace(/\/+$/,''),key=val('cf_key');if(!/^https:\/\/.+/.test(url)||key.length<20){toast('Проверь адрес и ключ');return}
  DB.cfg={url,key};clear('cf_');persist();connect()}
 else if(k==='auth'){auth(false)}
});

/* ---------- sync (Supabase) ---------- */
let sb=null,session=null,syncing=false,again=false,kickT=null,syncMsg='';
function setSync(msg,state){syncMsg=msg;const d=document.getElementById('syncdot');d.className='sync'+(state?' '+state:'');document.getElementById('synctxt').textContent=session?(state==='err'?'Ошибка синхронизации':'Синхронизировано'):(DB.cfg.url?'Не выполнен вход':'На этом устройстве')}
function kick(){if(!session)return;clearTimeout(kickT);kickT=setTimeout(sync,1500)}
function loadLib(){if(window.supabase)return Promise.resolve();return new Promise((res,rej)=>{const s=document.createElement('script');s.src=LIB;s.onload=res;s.onerror=()=>rej(new Error('нет интернета или библиотека не загрузилась'));document.head.appendChild(s)})}
async function connect(){const {url,key}=DB.cfg;if(!url||!key){setSync('');return}
 try{await loadLib();sb=window.supabase.createClient(url,key,{auth:{persistSession:true,storageKey:'planner-auth'}});
  const {data}=await sb.auth.getSession();session=data.session;
  sb.auth.onAuthStateChange((ev,s)=>{const was=!!session;session=s;if(s&&!was)sync();setSync(syncMsg,s?'on':'');render()});
  setSync('',session?'on':'');render();if(session)sync()}catch(e){setSync('Не подключилось: '+e.message,'err');render()}}
async function auth(signup){if(!sb){toast('База не подключена');return}const email=val('au_email'),password=val('au_pass');
 if(!email||password.length<6){toast('Нужна почта и пароль от 6 символов');return}
 const r=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
 if(r.error){toast(r.error.message.includes('Invalid login')?'Неверная почта или пароль':r.error.message.includes('not confirmed')?'Почта не подтверждена — см. README, шаг про Confirm email':r.error.message);return}
 if(signup&&!r.data.session){toast('Аккаунт создан. Подтверди почту или отключи подтверждение (README)');return}
 clear('au_');toast(signup?'Аккаунт создан':'Вход выполнен')}
const rowOf=(o,uidv)=>{const {id,kind,upd,del,...data}=o;return{user_id:uidv,id,kind,data,updated_at:upd,deleted:!!del}};
async function sync(){if(!sb||!session)return;if(syncing){again=true;return}
 if(!navigator.onLine){setSync('Нет интернета — синхронизирую позже','err');return}
 syncing=true;
 try{let rows=[],from=0;for(;;){const {data,error}=await sb.from('items').select('id,kind,data,updated_at,deleted').range(from,from+999);if(error)throw error;rows=rows.concat(data);if(data.length<1000)break;from+=1000}
  const remote={};let changed=false;
  for(const r of rows){remote[r.id]=r;const l=DB.items[r.id];if(!l||r.updated_at>(l.upd||0)){DB.items[r.id]={...r.data,id:r.id,kind:r.kind,upd:r.updated_at,del:r.deleted};delete DB.dirty[r.id];changed=true}}
  const ids=new Set(Object.keys(DB.dirty).filter(id=>DB.items[id]&&(!remote[id]||remote[id].updated_at<DB.items[id].upd)));
  for(const id in DB.items)if(!remote[id]&&(DB.items[id].upd||0)>1)ids.add(id);
  const arr=[...ids];const sent={};
  for(let i=0;i<arr.length;i+=500){const chunk=arr.slice(i,i+500).map(id=>{sent[id]=DB.items[id].upd;return rowOf(DB.items[id],session.user.id)});
   const {error}=await sb.from('items').upsert(chunk,{onConflict:'user_id,id'});if(error)throw error}
  for(const id in sent)if(DB.items[id]&&DB.items[id].upd===sent[id])delete DB.dirty[id];
  for(const id in DB.dirty)if(!DB.items[id])delete DB.dirty[id];
  DB.lastSync=Date.now();persist();
  setSync('Последняя синхронизация: '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),'on');if(changed||UI.tab==='set')render()}
 catch(e){const m=e.message||String(e);setSync('Не получилось синхронизировать: '+(m.includes('relation')||m.includes('does not exist')?'нет таблицы items — выполни SQL из README':m),'err');if(UI.tab==='set')render()}
 syncing=false;if(again){again=false;kick()}}
async function getFeed(){try{let {data,error}=await sb.from('feeds').select('token').maybeSingle();if(error)throw error;
 if(!data){({data,error}=await sb.from('feeds').insert({user_id:session.user.id}).select('token').single());if(error)throw error}
 UI.feed=DB.cfg.url+'/functions/v1/calendar?token='+data.token;render()}catch(e){toast('Не получилось: '+(e.message||e))}}

/* ---------- start ---------- */
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const old=TODAY;setToday();if(old!==TODAY)render();sync()}});
window.addEventListener('online',()=>sync());
window.matchMedia('(max-width:700px)').addEventListener('change',()=>{if(UI.tab==='cal')render()});
setInterval(()=>{if(document.visibilityState==='visible')sync()},60000);
render();setSync('');connect();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
